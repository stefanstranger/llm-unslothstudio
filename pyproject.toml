[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-unslothstudio"
version = "0.1.0"
description = "LLM plugin for models served by Unsloth Studio"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "llm>=0.33",
    "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/stefanstranger/llm-unslothstudio"
Issues = "https://github.com/stefanstranger/llm-unslothstudio/issues"

[project.entry-points.llm]
unslothstudio = "llm_unslothstudio"

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
    "pytest",
    "ruff",
    "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["llm_unslothstudio*"]